name: apk
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Free runner disk (keeps Android SDK and Java)
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup
          df -h
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: 3.47.7, cache: true}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test -j 1
      - run: flutter build apk --release --target-platform android-arm64
      - name: Prepare release files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/IndoorNav-v1.0.apk
          cp README.md docs/PROJECT_DETAILS.md dist/
      - name: Convert project report to Word
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          sudo apt-get install -y pandoc
          pandoc docs/PROJECT_DETAILS.md -o dist/PROJECT_DETAILS.docx
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0-testathon
          name: Testathon build v1.0
          overwrite_files: true
          files: dist/*
